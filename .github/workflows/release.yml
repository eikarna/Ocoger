# Cross-platform release pipeline.
# Triggered by pushing a git tag that matches v*.*.* (e.g. `v0.1.0`).
# Produces versioned archives and uploads them to a GitHub Release.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   suffix: .exe, archive: zip }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, suffix: "",   archive: tgz }
          - { os: macos-13,       target: x86_64-apple-darwin,      suffix: "",   archive: tgz }
          - { os: macos-14,       target: aarch64-apple-darwin,     suffix: "",   archive: tgz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Smoke test (cargo test)
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          SUFFIX="${{ matrix.suffix }}"
          SRC="target/$TARGET/release/ocoger$SUFFIX"
          PKG_NAME="ocoger-$VERSION-$TARGET"
          DEST="dist/$PKG_NAME"
          mkdir -p "$DEST"
          cp "$SRC" "$DEST/"
          cp README.md "$DEST/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$PKG_NAME.zip" "$PKG_NAME"
          else
            tar czf "../$PKG_NAME.tar.gz" "$PKG_NAME"
          fi
          cd ..
          ls dist/

      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ocoger-${{ github.ref_name }}-${{ matrix.target }}.zip
            dist/ocoger-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
