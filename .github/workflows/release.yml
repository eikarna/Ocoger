# Cross-platform release pipeline.
# Triggered by pushing a git tag that matches v*.*.* (e.g. `v0.1.0`).
# Produces versioned archives and uploads them to a GitHub Release.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — OpenCode ships here; CMD/PWSH/Windows Terminal/Alacritty/WezTerm.
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   suffix: .exe, archive: zip, test: true }
          # aarch64-pc-windows-msvc can't execute its own tests on x64 hosts
          # (ERROR_BAD_EXE_FORMAT 216) — build-only.
          - { os: windows-latest, target: aarch64-pc-windows-msvc,  suffix: .exe, archive: zip, test: false }
          # glibc Linux — mainstream distros (Ubuntu/Debian/Fedora/Arch).
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, suffix: "",   archive: tgz, test: true }
          # ARM-runner builds native aarch64 — tests can run there.
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, suffix: "", archive: tgz, test: true }
          # musl Linux — static binary; covers Alpine, Void-musl, postmarketOS,
          # and Android Termux (aarch64-musl runs under Termux's bionic-free env).
          # musl x86_64 runs on the ubuntu host directly; aarch64-musl is
          # cross-compiled on x64 (no QEMU) so tests are skipped there.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  suffix: "", archive: tgz, musl: true, test: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, suffix: "", archive: tgz, musl: true, test: false }
          # macOS — Terminal.app, iTerm2, Alacritty, WezTerm.
          # macos-13 (Intel) is retired/capacity-starved; cross-build x86_64
          # on the arm64 runner instead — Xcode links both arches natively.
          - { os: macos-14,       target: x86_64-apple-darwin,      suffix: "",   archive: tgz, test: false }
          - { os: macos-14,       target: aarch64-apple-darwin,     suffix: "",   archive: tgz, test: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl cross-link: aarch64 needs the musl-gcc wrapper + rust-std.
      - name: Install musl toolchain (aarch64 cross)
        if: matrix.musl && contains(matrix.target, 'aarch64')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # x86_64-musl links natively via rust-lld; only musl-gcc runtime needed.
      - name: Install musl toolchain (x86_64)
        if: matrix.musl && contains(matrix.target, 'x86_64')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Smoke test (cargo test)
        if: matrix.test
        run: cargo test --release --target ${{ matrix.target }} --locked

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          SUFFIX="${{ matrix.suffix }}"
          SRC="target/$TARGET/release/ocoger$SUFFIX"
          PKG_NAME="ocoger-$VERSION-$TARGET"
          DEST="dist/$PKG_NAME"
          mkdir -p "$DEST"
          cp "$SRC" "$DEST/"
          cp README.md "$DEST/"
          cd dist
          # Write the archive INSIDE dist/ so the upload glob under dist/
          # finds it. `../` placed it at repo root where the glob missed.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$PKG_NAME.zip" "$PKG_NAME" >/dev/null
          else
            tar czf "$PKG_NAME.tar.gz" "$PKG_NAME"
          fi
          cd ..
          ls dist/

      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v2
        with:
          # All 8 matrix legs hit this step; only one may auto-generate notes
          # or the release body ends up with N duplicate "Full Changelog"
          # lines. Pick a deterministic leg (windows x64) to own notes.
          generate_release_notes: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
          files: dist/ocoger-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive == 'zip' && 'zip' || 'tar.gz' }}
